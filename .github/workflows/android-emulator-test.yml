name: Android Emulator Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: System Info and Hardware Acceleration Check
        run: |
          set -x
          lscpu | tee accel-report.txt
          echo "" | tee -a accel-report.txt
          grep -E -c '(vmx|svm)' /proc/cpuinfo | tee -a accel-report.txt || echo "0" | tee -a accel-report.txt
          grep -E '(vmx|svm)' /proc/cpuinfo | head -n 5 | tee -a accel-report.txt || echo "No VMX flags" | tee -a accel-report.txt
          ls -lh /dev/kvm 2>&1 | tee -a accel-report.txt || echo "/dev/kvm not found" | tee -a accel-report.txt
          ls -l /dev/kvm 2>&1 | tee -a accel-report.txt || true
          if [ -e /dev/kvm ]; then stat /dev/kvm | tee -a accel-report.txt; kvm-ok 2>&1 | tee -a accel-report.txt || true; fi
          which qemu-system-x86_64 2>&1 | tee -a accel-report.txt || echo "qemu not preinstalled" | tee -a accel-report.txt
          cat /etc/os-release | tee -a accel-report.txt
          uname -a | tee -a accel-report.txt
      - name: Install Android SDK Command Line Tools
        run: |
          set -ex
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --list 2>&1 | head -n 100
          echo "SDK install done" | tee $HOME/sdk-install.log
      - name: Install Android Platform Tools, Emulator, and System Image
        run: |
          set -ex
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          sdkmanager --install "platform-tools" "emulator" "platforms;android-33" "system-images;android;google_apis;x86_64" --verbose 2>&1 | tee sdk-install-full.log
          sdkmanager --list_installed
          emulator -version 2>&1 | tee emulator-version.txt
          adb --version 2>&1 | tee adb-version.txt
          avdmanager list 2>&1 | tee avd-list-pre.txt || true
      - name: Create AVD
        run: |
          set -ex
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          echo "no" | avdmanager create avd -n test-avd -k "system-images;android;google_apis;x86_64" --device "pixel" --force 2>&1 | tee avd-create.log
          avdmanager list avd 2>&1 | tee avd-list.txt
          ls -lh ~/.android/avd/ 2>&1 | tee avd-dir.txt
          cat ~/.android/avd/test-avd.ini 2>&1 | tee avd-ini.txt || true
          cat ~/.android/avd/test-avd.avd/config.ini 2>&1 | tee avd-config.txt || true
      - name: Boot Emulator Headlessly and Test
        run: |
          set -ex
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          mkdir -p emulator-logs screenshots
          echo "=== Starting Emulator ===" | tee emulator-logs/boot.log
          emulator -accel-check 2>&1 | tee -a emulator-logs/boot.log || true
          nohup emulator -avd test-avd -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -port 5554 -memory 2048 -cores 2 > emulator-logs/emulator-output.log 2>&1 &
          echo $! > emulator-logs/emulator.pid
          echo "Waiting for adb device..." | tee -a emulator-logs/boot.log
          timeout 300 bash -c 'export ANDROID_HOME=$HOME/android-sdk; export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH; until adb devices | grep -q "emulator-5554"; do echo "Waiting..."; adb devices; sleep 5; done; echo "Emulator detected"; adb devices' 2>&1 | tee -a emulator-logs/boot.log
          echo "=== Waiting for boot_completed ===" | tee -a emulator-logs/boot.log
          timeout 400 bash -c 'export ANDROID_HOME=$HOME/android-sdk; export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH; until adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do echo "Still booting $(date)"; adb -s emulator-5554 shell getprop sys.boot_completed || echo "not ready"; sleep 10; done; echo "Boot completed!"' 2>&1 | tee -a emulator-logs/boot.log || echo "Boot timeout but continuing" | tee -a emulator-logs/boot.log
          adb -s emulator-5554 shell getprop ro.build.version.release 2>&1 | tee emulator-logs/getprop.log
          ANDROID_VERSION=$(cat emulator-logs/getprop.log | tr -d '\r' | xargs)
          echo "Android Version: $ANDROID_VERSION" | tee -a emulator-logs/getprop.log
          echo "$ANDROID_VERSION" > emulator-logs/android-version.txt
          adb -s emulator-5554 shell getprop 2>&1 | tee emulator-logs/all-props.txt || true
          adb -s emulator-5554 exec-out screencap -p > screenshots/emulator-screenshot.png 2>&1 || echo "Screenshot failed" | tee -a emulator-logs/boot.log
          ls -lh screenshots/ | tee -a emulator-logs/boot.log
          echo "=== Emulator Boot Test PASSED ===" | tee -a emulator-logs/boot.log
      - name: Collect Logs
        if: always()
        run: |
          set -x
          mkdir -p collected-logs
          cp -r emulator-logs/* collected-logs/ 2>/dev/null || true
          cp -r screenshots collected-logs/ 2>/dev/null || true
          cp *.txt collected-logs/ 2>/dev/null || true
          cp *.log collected-logs/ 2>/dev/null || true
          cp $HOME/sdk-install.log collected-logs/ 2>/dev/null || true
          cp sdk-install-full.log collected-logs/ 2>/dev/null || true
          ls -R collected-logs || true
          env | sort > collected-logs/env.txt || true
          cat /proc/cpuinfo > collected-logs/cpuinfo.txt || true
      - name: Upload Artifacts - Logs and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs-and-screenshots
          path: |
            collected-logs/
            emulator-logs/
            screenshots/
            accel-report.txt
            emulator-version.txt
            adb-version.txt
            avd-list.txt
            avd-create.log
            avd-config.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          echo "## Android Emulator Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-latest (GitHub-hosted)" >> $GITHUB_STEP_SUMMARY
          echo "- **SDK Install:** Check sdk-install-full.log artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **Hardware Acceleration:** Check accel-report.txt artifact (look for /dev/kvm and vmx/svm)" >> $GITHUB_STEP_SUMMARY
          echo "- **Emulator Boot:** Check emulator-logs/boot.log" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Version:** $(cat emulator-logs/android-version.txt 2>/dev/null || cat collected-logs/android-version.txt 2>/dev/null || echo 'see getprop.log')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts contain full logs and screenshots." >> $GITHUB_STEP_SUMMARY
